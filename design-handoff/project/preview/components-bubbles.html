<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;display:flex;flex-direction:column;gap:10px;max-width:560px}
.b{padding:12px 16px;font-size:15px;line-height:22px;border-radius:18px;letter-spacing:-.005em;max-width:78%;font-family:var(--font-system);position:relative}
.u{align-self:flex-end;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(245,241,255,.92));color:#1a1525;border-bottom-right-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.4),0 0 0 1px rgba(196,168,240,.25)}
.a{align-self:flex-start;color:var(--label);border-bottom-left-radius:6px;background:rgba(34,31,45,.55);border:1px solid rgba(220,210,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.a::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 0% 100%,rgba(196,168,240,.16),transparent 60%);pointer-events:none}
.a span{position:relative;font-family:var(--font-display);font-style:italic;color:rgba(196,168,240,.95);font-size:16px}
.s{align-self:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(196,168,240,.6);padding:6px 14px;border-radius:99px;background:rgba(196,168,240,.08);border:1px solid rgba(196,168,240,.18)}
</style></head><body>
<div class="b u">Show me flights from Lagos to London</div>
<div class="b a"><span>Of course.</span> Saved as Flight Tracker — open whenever you'd like.</div>
<div class="b s">·  reconnecting  ·</div>
</body></html>
