name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax check (Node ${{ matrix.node }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Install without running scripts so the heavy Electron binary download is
      # skipped — CI only needs the dependency tree to resolve, not to launch.
      - name: Install dependencies (no scripts)
        run: npm install --ignore-scripts

      - name: Validate package.json
        run: node -e "require('./package.json'); console.log('package.json is valid JSON')"

      # No test/lint suite yet — gate on `node --check` across every runtime file.
      - name: Syntax check (node --check)
        run: |
          find server bin v2/host -type f \( -name '*.js' -o -name '*.cjs' \) -print0 \
            | xargs -0 -n1 node --check
          echo "All runtime source files passed node --check"
