<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bed of Roses — Y2K / Frutiger Aero UI Kit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Y2K / Frutiger Aero — translucent gel, sky gradients, lime accents */
  :root{
    --sky-1:#9ED6FF;
    --sky-2:#3BA8FF;
    --sky-3:#0066FF;
    --aqua:#00D5FF;
    --lime:#A8E063;
    --lime-deep:#5FC92F;
    --silver:#C8D6E5;
    --silver-2:#E6EEF6;
    --white:#FFFFFF;
    --ink:#0A2A4D;
    --ink-2:rgba(10,42,77,.72);
    --ink-3:rgba(10,42,77,.5);
    --line:rgba(255,255,255,.55);
    --gloss:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.35) 48%, rgba(255,255,255,0) 50%, rgba(255,255,255,.18) 100%);
    --sky:linear-gradient(180deg,#BFE7FF 0%,#7FC8FF 35%,#3BA8FF 75%,#0066FF 100%);
    --sky-soft:linear-gradient(180deg,#E5F4FF 0%,#BFE7FF 60%,#9ED6FF 100%);

    --sans:"Sora",-apple-system,system-ui,sans-serif;
    --body:"Inter",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  html,body{margin:0;background:var(--sky-soft);color:var(--ink);font-family:var(--body)}
  *{box-sizing:border-box}

  /* Typography */
  .y-h1{font-family:var(--sans);font-weight:800;font-size:88px;line-height:.95;letter-spacing:-.04em}
  .y-h2{font-family:var(--sans);font-weight:700;font-size:36px;line-height:1.05;letter-spacing:-.025em}
  .y-h3{font-family:var(--sans);font-weight:700;font-size:22px;letter-spacing:-.015em}
  .y-display{font-family:var(--body);font-weight:400;font-size:17px;line-height:1.5;color:var(--ink-2)}
  .y-body{font-family:var(--body);font-weight:400;font-size:14px;line-height:1.6;color:var(--ink-2)}
  .y-mono{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink-2)}
  .y-eyebrow{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sky-3)}

  /* Glass surface */
  .glass{
    background:linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.36) 50%, rgba(255,255,255,.42) 50.1%, rgba(255,255,255,.16) 100%);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border:1px solid rgba(255,255,255,.7);
    border-radius:16px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -10px 24px rgba(0,102,255,.08),
      0 18px 40px -12px rgba(0,40,120,.28),
      0 2px 6px rgba(0,40,120,.18);
  }
  .glass-blue{
    background:linear-gradient(180deg, rgba(159,214,255,.85) 0%, rgba(59,168,255,.55) 50%, rgba(0,102,255,.55) 50.1%, rgba(0,102,255,.65) 100%);
    border:1px solid rgba(255,255,255,.6);
    border-radius:16px;
    color:#fff;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -8px 16px rgba(0,40,120,.35),
      0 16px 36px -10px rgba(0,40,120,.45);
  }
  .gel{
    position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:46px;padding:0 22px;border-radius:999px;
    font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:0;
    border:1px solid rgba(255,255,255,.7);
    background:linear-gradient(180deg,#7FC8FF 0%,#3BA8FF 50%,#0066FF 50.1%,#003FA8 100%);
    color:#fff;cursor:pointer;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -2px 0 rgba(0,30,90,.5),
      0 8px 16px -2px rgba(0,40,120,.4),
      0 1px 2px rgba(0,40,120,.3);
    text-shadow:0 1px 0 rgba(0,30,90,.35);
  }
  .gel::before{content:'';position:absolute;left:6px;right:6px;top:3px;height:42%;border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.15));pointer-events:none}
  .gel:hover{filter:brightness(1.06)}
  .gel-lime{background:linear-gradient(180deg,#D6FF9D 0%,#A8E063 50%,#5FC92F 50.1%,#3FA017 100%);color:#15330A;text-shadow:0 1px 0 rgba(255,255,255,.4)}
  .gel-silver{background:linear-gradient(180deg,#FFFFFF 0%,#E1E9F2 50%,#C8D6E5 50.1%,#92A8C2 100%);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.7)}
  .gel-aqua{background:linear-gradient(180deg,#CCF5FF 0%,#7FE6FF 50%,#00D5FF 50.1%,#0095BF 100%);color:#02334A;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .gel-ghost{background:linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.4));color:var(--ink);text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 6px 14px -4px rgba(0,40,120,.25)}
  .gel-sm{height:34px;padding:0 16px;font-size:12px;border-radius:999px}
  .gel-lg{height:58px;padding:0 30px;font-size:16px}

  /* Field */
  .y-input{height:44px;padding:0 16px;width:100%;border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.7));
    border:1px solid rgba(255,255,255,.85);
    box-shadow:inset 0 2px 4px rgba(0,40,120,.12), inset 0 -1px 0 rgba(255,255,255,.6), 0 1px 0 rgba(255,255,255,.6);
    font-family:var(--body);font-size:14px;color:var(--ink);outline:none}
  .y-input::placeholder{color:var(--ink-3)}
  .y-input-focus{box-shadow:inset 0 2px 4px rgba(0,40,120,.12), 0 0 0 3px rgba(0,213,255,.45), 0 0 0 6px rgba(0,213,255,.2)}

  .y-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.55));
    border:1px solid rgba(255,255,255,.85);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 8px -2px rgba(0,40,120,.18);
    font-family:var(--sans);font-weight:500;font-size:12px;color:var(--ink);cursor:pointer}
  .y-chip-on{background:linear-gradient(180deg,#7FC8FF,#0066FF);color:#fff;border-color:rgba(255,255,255,.7)}
  .y-chip-lime{background:linear-gradient(180deg,#D6FF9D,#5FC92F);color:#15330A}

  /* Bubble + tile */
  .y-bubble{padding:12px 16px;border-radius:18px;font-family:var(--body);font-size:14px;line-height:1.5;max-width:78%;
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.55));
    border:1px solid rgba(255,255,255,.85);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 6px 14px -4px rgba(0,40,120,.2)}
  .y-bubble-user{align-self:flex-end;color:#fff;background:linear-gradient(180deg,#7FC8FF,#0066FF);border:1px solid rgba(255,255,255,.55)}
  .y-bubble-ai{align-self:flex-start}

  /* Helpers */
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:12px}

  /* Bokeh + droplet decorations */
  .bokeh{position:absolute;border-radius:50%;filter:blur(14px);pointer-events:none;mix-blend-mode:screen}
  .drop{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.4) 25%, rgba(168,224,99,.12) 60%, rgba(0,102,255,.05) 100%);
    box-shadow:inset 0 -6px 14px rgba(0,80,160,.25), inset 0 6px 14px rgba(255,255,255,.6), 0 8px 18px -6px rgba(0,40,120,.45);
    pointer-events:none}
  .drop::after{content:'';position:absolute;left:18%;top:14%;width:32%;height:18%;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(2px)}

  .stage{position:relative;height:100%;overflow:hidden}
  .stage.sky{background:var(--sky-soft)}
  .stage.deep{background:var(--sky)}
  .stage.silver{background:linear-gradient(180deg,#F2F7FC 0%,#D9E5F2 100%)}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="brutalist/design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="y2k/kit.jsx"></script>
</body>
</html>
