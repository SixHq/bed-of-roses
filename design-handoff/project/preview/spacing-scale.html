<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--canvas);display:flex;align-items:flex-end;gap:6px}
.bar{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{background:rgba(232,232,238,.10);border:1px solid var(--hairline);border-radius:6px;width:36px}
.l{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--label-3)}
.v{font-family:var(--font-mono);font-size:9px;color:var(--label-2)}
</style></head><body>
<div class="bar"><div class="box" style="height:4px"></div><span class="l">s-1</span><span class="v">4</span></div>
<div class="bar"><div class="box" style="height:8px"></div><span class="l">s-2</span><span class="v">8</span></div>
<div class="bar"><div class="box" style="height:12px"></div><span class="l">s-3</span><span class="v">12</span></div>
<div class="bar"><div class="box" style="height:16px"></div><span class="l">s-4</span><span class="v">16</span></div>
<div class="bar"><div class="box" style="height:20px"></div><span class="l">s-5</span><span class="v">20</span></div>
<div class="bar"><div class="box" style="height:24px"></div><span class="l">s-6</span><span class="v">24</span></div>
<div class="bar"><div class="box" style="height:32px"></div><span class="l">s-7</span><span class="v">32</span></div>
<div class="bar"><div class="box" style="height:40px"></div><span class="l">s-8</span><span class="v">40</span></div>
<div class="bar"><div class="box" style="height:56px"></div><span class="l">s-9</span><span class="v">56</span></div>
<div class="bar"><div class="box" style="height:72px"></div><span class="l">s-10</span><span class="v">72</span></div>
<div class="bar"><div class="box" style="height:96px"></div><span class="l">s-11</span><span class="v">96</span></div>
</body></html>
