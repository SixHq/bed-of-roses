<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.s{position:relative;height:108px;border-radius:20px;overflow:hidden;background:var(--surface-1);border:1px solid var(--hairline);padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.s::before{content:'';position:absolute;inset:-30%;background:radial-gradient(circle at 50% 60%,rgba(var(--c),.55),transparent 55%);filter:blur(6px);opacity:.85}
.orb{position:relative;width:30px;height:30px;border-radius:50%;background:rgba(var(--c),1);box-shadow:0 0 24px rgba(var(--c),.7),0 0 60px rgba(var(--c),.35);align-self:flex-start}
.row{position:relative;display:flex;justify-content:space-between;align-items:baseline}
.name{font-family:var(--font-display);font-style:italic;font-size:20px;color:var(--label);letter-spacing:-.01em}
.hex{font-family:var(--font-mono);font-size:9px;color:rgba(var(--c),.85);letter-spacing:.08em}
</style></head><body>
<div class="s" style="--c:232,232,238"><div class="orb"></div><div class="row"><span class="name">Pearl</span><span class="hex">E8E8EE</span></div></div>
<div class="s" style="--c:245,195,107"><div class="orb"></div><div class="row"><span class="name">Amber</span><span class="hex">F5C36B</span></div></div>
<div class="s" style="--c:248,142,102"><div class="orb"></div><div class="row"><span class="name">Ember</span><span class="hex">F88E66</span></div></div>
<div class="s" style="--c:244,158,186"><div class="orb"></div><div class="row"><span class="name">Bloom</span><span class="hex">F49EBA</span></div></div>
<div class="s" style="--c:143,229,197"><div class="orb"></div><div class="row"><span class="name">Aurora</span><span class="hex">8FE5C5</span></div></div>
<div class="s" style="--c:160,203,240"><div class="orb"></div><div class="row"><span class="name">Frost</span><span class="hex">A0CBF0</span></div></div>
<div class="s" style="--c:196,168,240"><div class="orb"></div><div class="row"><span class="name">Lilac</span><span class="hex">C4A8F0</span></div></div>
<div class="s" style="--c:155,155,165"><div class="orb"></div><div class="row"><span class="name">Onyx</span><span class="hex">9B9BA5</span></div></div>
</body></html>
