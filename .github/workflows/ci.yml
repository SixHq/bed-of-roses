name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20]
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Validate package.json
        run: node -e "require('./package.json'); console.log('package.json is valid JSON')"

      - name: Unit tests (platform branches)
        run: npm test

      - name: Runtime boot smoke
        run: node scripts/ci-boot-smoke.cjs

      - name: Electron host smoke (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/ci-electron-smoke.cjs

      - name: Electron host smoke (Windows/macOS)
        if: runner.os != 'Linux'
        run: node scripts/ci-electron-smoke.cjs
