<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
:root{--c:143,229,197}
body{margin:0;padding:0;background:#000;height:200px;overflow:hidden;position:relative}
.amb{position:absolute;inset:0}
.dot{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(var(--c),.6);box-shadow:0 0 4px rgba(var(--c),.6)}
.sun{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(var(--c),.18),transparent 60%);left:30%;top:-30%;filter:blur(20px)}
.l{position:absolute;bottom:14px;left:14px;font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(var(--c),.7);z-index:2}
</style></head><body>
<div class="amb">
  <div class="sun"></div>
  <div class="dot" style="left:5%;top:30%"></div>
  <div class="dot" style="left:12%;top:60%"></div>
  <div class="dot" style="left:22%;top:20%"></div>
  <div class="dot" style="left:34%;top:75%;width:3px;height:3px"></div>
  <div class="dot" style="left:48%;top:40%"></div>
  <div class="dot" style="left:55%;top:15%"></div>
  <div class="dot" style="left:64%;top:65%"></div>
  <div class="dot" style="left:72%;top:35%;width:3px;height:3px"></div>
  <div class="dot" style="left:80%;top:80%"></div>
  <div class="dot" style="left:88%;top:25%"></div>
  <div class="dot" style="left:92%;top:55%"></div>
</div>
<span class="l">Ambient · Aurora · drifting motes + sun</span>
</body></html>
