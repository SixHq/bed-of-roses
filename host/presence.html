<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Bed of Roses Presence</title>
  <link rel="stylesheet" href="./presence.css">
</head>
<body>
  <main class="presence" data-mode="collapsed" data-orb-state="idle" data-anchor="bottom-right">
    <section class="bubble thought hidden compact" id="thought" aria-live="polite" aria-label="Bed of Roses activity">
      <header class="bubble-head">
        <div class="mode" id="thought-mode"><em>Thinking</em></div>
        <span class="meta" id="thought-meta">0:00</span>
        <div class="actions">
          <button class="head-btn apps-btn" id="surfaces" type="button" title="App Library" aria-label="App Library">
            <svg class="apps-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.6"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.6"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.6"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.6"></rect>
            </svg>
          </button>
          <button class="head-btn notify-btn" id="notifications" type="button" title="Notifications" aria-label="Notifications">
            <svg class="notify-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18a3 3 0 0 1-6 0"></path>
              <path d="M19 14.7c-1.2-1.35-1.7-2.85-1.7-5.2a5.3 5.3 0 0 0-10.6 0c0 2.35-.5 3.85-1.7 5.2-.65.73-.1 1.8.88 1.8h12.24c.98 0 1.53-1.07.88-1.8Z"></path>
              <path d="M4.8 5.6 3.6 4.4"></path>
              <path d="M19.2 5.6 20.4 4.4"></path>
            </svg>
            <span class="head-badge hidden" id="notification-count">0</span>
          </button>
          <button class="head-btn history-btn" id="history" type="button" title="History" aria-label="Conversation history">
            <svg class="history-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
              <path d="M12 7v5l4 2"></path>
            </svg>
          </button>
          <button class="head-btn mcp-btn" id="mcp-market" type="button" title="MCP Marketplace" aria-label="MCP Marketplace">
            <svg class="mcp-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
              <path d="m3.3 7 8.7 5 8.7-5"></path>
              <path d="M12 22V12"></path>
            </svg>
          </button>
          <button class="head-btn" id="minimize-task" type="button" title="Minimize">-</button>
          <button class="head-btn" id="stop-task" type="button" title="New thread" aria-label="New thread">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
          <button class="head-btn" id="close-thought" type="button" title="Close">×</button>
        </div>
      </header>
      <div class="bubble-body" id="thought-body"></div>
      <footer class="bubble-foot hidden" id="thought-foot"></footer>
      <span class="bubble-tail" aria-hidden="true"></span>
      <span class="bubble-resize-zone resize-n" data-bubble-resize="n" aria-hidden="true"></span>
      <span class="bubble-resize-zone resize-e" data-bubble-resize="e" aria-hidden="true"></span>
      <span class="bubble-resize-zone resize-s" data-bubble-resize="s" aria-hidden="true"></span>
      <span class="bubble-resize-zone resize-w" data-bubble-resize="w" aria-hidden="true"></span>
      <span class="bubble-resize-zone resize-nw resize-corner" data-bubble-resize="nw" aria-hidden="true"></span>
      <span class="bubble-resize-zone resize-ne resize-corner" data-bubble-resize="ne" aria-hidden="true"></span>
      <span class="bubble-resize-zone resize-sw resize-corner" data-bubble-resize="sw" aria-hidden="true"></span>
      <span class="bubble-resize-zone resize-se resize-corner" data-bubble-resize="se" aria-hidden="true"></span>
    </section>

    <section class="task-chip hidden" id="task-chip" aria-label="Minimized Bed of Roses task">
      <span class="mini" aria-hidden="true"></span>
      <span class="name" id="task-chip-name">Task</span>
      <span class="pct" id="task-chip-pct">running</span>
    </section>

    <section class="surface-drawer hidden" id="surface-drawer">
      <header>
        <span class="card-title">App Library<span class="surface-count" id="surface-count"></span></span>
        <div class="actions">
          <button class="head-btn" id="setup" type="button" title="Open the main Bed of Roses app" aria-label="Open main app">
            <svg class="apps-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path>
            </svg>
          </button>
          <button class="head-btn" id="close-surfaces" type="button" title="Close" aria-label="Close App Library">×</button>
        </div>
      </header>
      <div class="surface-grid" id="surface-list"></div>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <button class="orb-control" id="orb" type="button" aria-label="Open Bed of Roses">
        <span class="orb-wrap" id="orb-wrap" aria-hidden="true">
          <span class="orb-aura idle"></span>
          <span class="orb-ring-spin"></span>
          <span class="orb-ring"></span>
          <span class="orb">
            <span class="orb-glint"></span>
            <span class="orb-face"><span></span><span></span></span>
          </span>
          <span class="orb-badge hidden" id="orb-badge">1</span>
          <span class="zzz">z</span>
        </span>
        <span class="hover-hint">⌥ space · ask</span>
      </button>

      <button class="notification-chip hidden" id="notification-chip" type="button" aria-label="Open latest notification">
        <span class="notification-chip-kicker" id="notification-chip-count">1 unread</span>
        <span class="notification-chip-subject" id="notification-chip-subject">Notification</span>
      </button>

      <div class="prompt-stack">
        <div class="chip-rail hidden" id="chip-rail"></div>
        <div class="prompt-shell">
          <button class="iconbtn" id="attach" type="button" title="Attach">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M8 3v10M3 8h10"></path>
            </svg>
          </button>
          <span class="prompt-sigil" aria-hidden="true">$&gt;</span>
          <textarea class="prompt-input" id="prompt" rows="1" placeholder="Ask, or describe what you need..." autocomplete="off"></textarea>
          <button class="model-chip" id="model-chip" type="button" title="Change model">
            <span id="model-chip-label">model</span>
          </button>
          <button class="iconbtn" id="prompt-menu-btn" type="button" title="Options" aria-label="Options" aria-haspopup="menu" aria-expanded="false">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.26" stroke-linecap="round">
              <path d="M3 4.5h10"></path>
              <path d="M3 8h10"></path>
              <path d="M3 11.5h10"></path>
            </svg>
          </button>
          <button class="send" id="send" type="submit" title="Send" aria-label="Send">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8h10M9 4l4 4-4 4"></path>
            </svg>
          </button>
        </div>
        <div class="prompt-menu hidden" id="prompt-menu" role="menu" aria-label="Options">
          <button class="prompt-menu-item" type="button" role="menuitem" data-menu-action="notifications">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18a3 3 0 0 1-6 0"></path>
              <path d="M19 14.7c-1.2-1.35-1.7-2.85-1.7-5.2a5.3 5.3 0 0 0-10.6 0c0 2.35-.5 3.85-1.7 5.2-.65.73-.1 1.8.88 1.8h12.24c.98 0 1.53-1.07.88-1.8Z"></path>
            </svg>
            <span class="prompt-menu-label">Notifications</span>
            <span class="prompt-menu-badge hidden" id="prompt-menu-notification-count">0</span>
          </button>
          <button class="prompt-menu-item" type="button" role="menuitem" data-menu-action="history">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
              <path d="M12 7v5l4 2"></path>
            </svg>
            <span class="prompt-menu-label">History</span>
          </button>
          <button class="prompt-menu-item" type="button" role="menuitem" data-menu-action="mcp">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
              <path d="m3.3 7 8.7 5 8.7-5"></path>
              <path d="M12 22V12"></path>
            </svg>
            <span class="prompt-menu-label">MCP Marketplace</span>
          </button>
          <button class="prompt-menu-item" type="button" role="menuitem" data-menu-action="apps">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.6"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.6"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.6"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.6"></rect>
            </svg>
            <span class="prompt-menu-label">App Library</span>
          </button>
          <span class="prompt-menu-divider" aria-hidden="true"></span>
          <button class="prompt-menu-item" type="button" role="menuitem" data-menu-action="new-presence" title="Manage presences — create, delete, inspect logs">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 8v8M8 12h8"></path>
            </svg>
            <span class="prompt-menu-label">New Presence</span>
          </button>
        </div>
      </div>
    </form>
  </main>
  <script src="./presence.js"></script>
</body>
</html>
