<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:0;height:200px;position:relative;overflow:hidden}
.frame{position:absolute;inset:18px;border-radius:14px;border:1px solid rgba(220,210,255,.10);background:radial-gradient(ellipse 50% 70% at 50% 100%,rgba(196,168,240,.10),transparent 70%);pointer-events:none}
.cell{position:absolute;display:flex;align-items:center;gap:10px;padding:14px 22px;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,232,250,.7)}
.tl{top:0;left:0}.tr{top:0;right:0}.bl{bottom:0;left:0}.br{bottom:0;right:0}
.dot{width:6px;height:6px;border-radius:50%;background:#C4A8F0;box-shadow:0 0 10px #C4A8F0}
.meta{color:rgba(238,232,250,.32)}
.serif{font-family:var(--font-display);font-style:italic;font-size:14px;text-transform:none;letter-spacing:-.005em;color:rgba(196,168,240,.85)}
</style></head><body>
<div class="frame"></div>
<div class="cell tl"><span class="dot"></span><span class="serif">bed of roses</span><span class="meta">14:32</span></div>
<div class="cell tr"><span class="serif">brainstem</span><span class="meta">v0.4</span></div>
<div class="cell bl"><span>· identity ·</span></div>
<div class="cell br"><span class="serif">listening</span></div>
</body></html>
