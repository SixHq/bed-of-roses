<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
:root{--c:232,232,238}
body{margin:0;padding:30px;background:var(--canvas);display:flex;gap:24px;align-items:center;justify-content:center}
.box{width:140px;height:80px;border-radius:14px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-family:var(--font-system);font-weight:600;font-size:13px;letter-spacing:-.01em}
.b1{box-shadow:0 0 0 1px rgba(var(--c),.35),0 0 24px rgba(var(--c),.16),0 0 60px rgba(var(--c),.08),0 12px 32px rgba(0,0,0,.45)}
.b2{--c:248,142,102;box-shadow:0 0 0 1px rgba(var(--c),.45),0 0 32px rgba(var(--c),.32),0 0 80px rgba(var(--c),.16),0 12px 32px rgba(0,0,0,.45)}
.b3{--c:160,203,240;box-shadow:0 0 0 1px rgba(var(--c),.45),0 0 32px rgba(var(--c),.30),0 0 80px rgba(var(--c),.16),0 12px 32px rgba(0,0,0,.45)}
.l{position:absolute;bottom:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--label-3)}
.w{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--label-3)}
</style></head><body>
<div class="w"><div class="box b1">Begin</div><span class="cap">pearl · soft</span></div>
<div class="w"><div class="box b2">Begin</div><span class="cap">ember · medium</span></div>
<div class="w"><div class="box b3">Begin</div><span class="cap">frost · strong</span></div>
</body></html>
