<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;display:flex;gap:18px;align-items:center;justify-content:center}
.av{position:relative;width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.av::before{content:'';position:absolute;inset:-24%;background:conic-gradient(from var(--a,0deg),rgba(var(--c),.0),rgba(var(--c),.55),rgba(var(--c2),.45),rgba(var(--c),.0));border-radius:50%;filter:blur(14px);animation:rot 12s linear infinite}
.av::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 55%,rgba(var(--c),.18),transparent 70%);border:1.5px solid rgba(var(--c),.55);box-shadow:inset 0 0 24px rgba(var(--c),.18)}
.dot{position:relative;z-index:2;width:18px;height:18px;border-radius:50%;background:rgba(var(--c),1);box-shadow:0 0 28px rgba(var(--c),.7),0 0 60px rgba(var(--c),.35);animation:b 3.4s ease-in-out infinite}
.lbl{position:absolute;bottom:-26px;font-family:var(--font-display);font-style:italic;font-size:15px;color:rgba(var(--c),.85);letter-spacing:-.005em;white-space:nowrap}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes b{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
</style></head><body>
<div class="av" style="--c:196,168,240;--c2:160,203,240"><span class="dot"></span><span class="lbl">Lilac</span></div>
<div class="av" style="--c:143,229,197;--c2:160,203,240;--a:90deg"><span class="dot"></span><span class="lbl">Aurora</span></div>
<div class="av" style="--c:244,158,186;--c2:196,168,240;--a:200deg"><span class="dot"></span><span class="lbl">Bloom</span></div>
</body></html>
