<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:30px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:baseline;gap:22px}
.role{font-family:var(--font-display);font-style:italic;font-size:24px;color:var(--label);letter-spacing:-.012em;width:140px}
.sample{font-family:var(--font-system);font-size:18px;letter-spacing:-.005em;flex:1}
.spec{font-family:var(--font-mono);font-size:10px;color:var(--label-3);letter-spacing:.08em}
</style></head><body>
<div class="row"><span class="role">Voice</span><span class="sample" style="color:#F5F1FF">She speaks softly across the desk.</span><span class="spec">label · 100%</span></div>
<div class="row"><span class="role">Body</span><span class="sample" style="color:rgba(238,232,250,.62)">She speaks softly across the desk.</span><span class="spec">label-2 · 62%</span></div>
<div class="row"><span class="role">Hint</span><span class="sample" style="color:rgba(238,232,250,.34)">She speaks softly across the desk.</span><span class="spec">label-3 · 34%</span></div>
<div class="row"><span class="role">Echo</span><span class="sample" style="color:rgba(238,232,250,.20)">She speaks softly across the desk.</span><span class="spec">label-4 · 20%</span></div>
</body></html>
