<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--canvas);display:flex;flex-direction:column;gap:14px;font-family:var(--font-mono)}
.lbl{font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:rgba(232,232,238,.50)}
.lbl::before{content:'/ ';opacity:.6}
.hud{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(232,232,238,.75);display:flex;gap:10px;align-items:center}
.tick{font-size:8px;color:rgba(232,232,238,.85)}
.meta{color:rgba(232,232,238,.32)}
.row{display:flex;justify-content:space-between;border-top:1px solid var(--hairline-soft);padding-top:14px}
</style></head><body>
<span class="lbl">Name</span>
<span class="lbl">Api key</span>
<span class="lbl">Quick presets</span>
<div class="row">
  <div class="hud"><span class="tick">●</span><span>Bed · Of · Roses</span><span class="meta">14:32:08</span></div>
  <div class="hud"><span>v0.3 · Brainstem</span><span class="meta">N7-A1</span></div>
</div>
</body></html>
