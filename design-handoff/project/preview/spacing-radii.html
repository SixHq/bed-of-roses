<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--canvas);display:flex;align-items:flex-end;gap:14px}
.b{background:var(--surface-1);border:1px solid var(--hairline);width:90px;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;gap:4px}
.l{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
.v{font-family:var(--font-mono);font-size:9px;color:var(--label-3)}
</style></head><body>
<div class="b" style="border-radius:12px"><span class="l">input</span><span class="v">12</span></div>
<div class="b" style="border-radius:14px"><span class="l">button</span><span class="v">14</span></div>
<div class="b" style="border-radius:16px"><span class="l">bar</span><span class="v">16</span></div>
<div class="b" style="border-radius:22px"><span class="l">tile</span><span class="v">22</span></div>
<div class="b" style="border-radius:28px"><span class="l">modal</span><span class="v">28</span></div>
</body></html>
