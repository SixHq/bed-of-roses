<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:30px 26px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:18px}
.name{font-family:var(--font-display);font-style:italic;font-size:22px;color:var(--label);letter-spacing:-.01em;width:130px}
.line{flex:1;height:1px}
.s1{background:linear-gradient(90deg,transparent,rgba(220,210,255,.06),transparent)}
.s2{background:linear-gradient(90deg,transparent,rgba(220,210,255,.10) 30%,rgba(196,168,240,.18) 50%,rgba(220,210,255,.10) 70%,transparent)}
.s3{background:linear-gradient(90deg,transparent,rgba(196,168,240,.30) 25%,rgba(143,229,197,.25) 50%,rgba(244,158,186,.30) 75%,transparent);height:1.5px;box-shadow:0 0 8px rgba(196,168,240,.4)}
.spec{font-family:var(--font-mono);font-size:10px;color:var(--label-3);letter-spacing:.06em;width:160px;text-align:right}
</style></head><body>
<div class="row"><span class="name">Whisper</span><div class="line s1"></div><span class="spec">soft · 6%</span></div>
<div class="row"><span class="name">Resting</span><div class="line s2"></div><span class="spec">default · 10%</span></div>
<div class="row"><span class="name">Awake</span><div class="line s3"></div><span class="spec">focus · iridescent</span></div>
</body></html>
